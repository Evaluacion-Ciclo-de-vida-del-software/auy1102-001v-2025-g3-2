name: CI/CD Pipeline Seguro (Grupo 3)

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "master" ]

jobs:
  # JOB 1: Análisis de Seguridad
  security-analysis:
    name: Security & Quality Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Snyk Security Scan
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=evaluacion-ciclo-de-vida-del-software
            -Dsonar.projectKey=Evaluacion-Ciclo-de-vida-del-software_auy1102-001v-2025-g3-2
            -Dsonar.sources=src
            -Dsonar.tests=test
            -Dsonar.typescript.lcov.reportPaths=coverage/lcov.info

      - name: Dependency Review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v3

  # JOB 2: Docker Build, Scan & Push
  docker-build-push:
    name: Docker Build, Test & Push
    needs: security-analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # PASO 1: Construir imagen localmente (sin subir)
      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true  # ← CLAVE: construye en el runner de GitHub
          tags: ${{ secrets.DOCKER_USERNAME }}/auy1102-g3-2:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # PASO 2: Escanear con Docker Scout ANTES de subir
      - name: Docker Scout Security Scan
        uses: docker/scout-action@v1
        with:
          command: cves
          image: ${{ secrets.DOCKER_USERNAME }}/auy1102-g3-2:latest
          only-severities: critical  # ← Solo críticas
          exit-code: true  # ← Falla si hay críticas
          dockerhub-user: ${{ secrets.DOCKER_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKER_PASSWORD }}

      # PASO 3: Si pasó el escaneo, AHORA sí subir a Docker Hub
      - name: Push Docker Image to Docker Hub
        if: success()  # Solo si los pasos anteriores pasaron
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true  # ← AHORA sí hace push
          tags: ${{ secrets.DOCKER_USERNAME }}/auy1102-g3-2:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max